name: Reusable CI Tests

on:
  workflow_call:
    inputs:
      full_matrix:
        description: Run full OS matrix (macOS + Windows)
        required: false
        default: false
        type: boolean
      full_matrix_label:
        description: PR label that triggers full matrix
        required: false
        default: full-ci
        type: string

jobs:
  validate-linux:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Configure git line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          install-xvfb: 'true'

      - name: Check native packaging ABI
        run: npm run packaging:check-native-abi

      - name: Run linter
        run: npm run lint

      - name: Run dead-code gate
        run: npm run lint:dead-code

      - name: Run typecheck
        run: npm run typecheck

      - name: Run build smoke
        run: npm run build:vite

      - name: Run tests
        run: npm run test:run

      - name: Run dev boot preflight
        run: xvfb-run -a npm run dev:smoke

      - name: Run integration tests
        run: npm run test:integration

  validate-linux-arm64:
    name: Test (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Configure git line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Check native packaging ABI
        run: npm run packaging:check-native-abi

      - name: Run typecheck
        run: npm run typecheck

      - name: Run build smoke
        run: npm run build:vite

      - name: Run tests (no coverage)
        run: npm run test:run

      - name: Run integration tests
        run: npm run test:integration

  validate-matrix:
    name: Test (${{ matrix.os }})
    needs: validate-linux
    runs-on: ${{ matrix.os }}
    if: ${{ (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, inputs.full_matrix_label)) || (github.event_name == 'workflow_dispatch' && inputs.full_matrix == true) }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Configure git line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Check native packaging ABI
        run: npm run packaging:check-native-abi

      - name: Run tests (no coverage)
        run: npm run test:run

      - name: Run integration tests
        run: npm run test:integration
