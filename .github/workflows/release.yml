name: Release

on:
  # Trigger when release PR is merged
  push:
    branches:
      - main
    paths:
      - 'package.json'
  # Allow manual trigger for specific platforms or re-runs
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - macos
          - windows

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-release:
    name: Check Release
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-release-check.yml
    with:
      platforms: ${{ inputs.platforms || 'all' }}

  build:
    name: Build
    needs: [check-release]
    if: needs.check-release.outputs.is_release == 'true'
    uses: ./.github/workflows/reusable-build-desktop.yml
    with:
      matrix: ${{ needs.check-release.outputs.matrix }}
      checkout_ref: ${{ needs.check-release.outputs.tag }}
      artifact_prefix: release
      artifact_retention_days: 14
      artifact_if_no_files: warn
      run_smoke_tests: true
      verify_auto_update: true
      generate_checksums: true
      list_artifacts: false
      enable_macos_signing: true
      linux_use_system_fpm: 'true'
      install_xvfb: true
      install_linux_packaging_deps: true
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish:
    name: Publish Release
    needs: [check-release, build]
    if: needs.check-release.outputs.is_release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-release-publish.yml
    with:
      tag: ${{ needs.check-release.outputs.tag }}
      version: ${{ needs.check-release.outputs.version }}
      artifact_prefix: release
