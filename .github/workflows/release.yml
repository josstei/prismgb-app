name: Release

on:
  # Trigger when release PR is merged
  push:
    branches:
      - main
    paths:
      - 'package.json'
  # Allow manual trigger for specific platforms or re-runs
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - macos
          - windows

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Check if this is a release commit and create tag
  check-release:
    name: Check Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check if release commit
        id: check
        run: |
          # Get the commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          # Check if this is a release commit (from prepare-release workflow)
          # Match anywhere in message to handle merge commits
          if [[ "$COMMIT_MSG" =~ chore\(release\):\ bump\ to\ v([0-9]+\.[0-9]+\.[0-9]+) ]] || \
             [[ "$COMMIT_MSG" =~ chore\(release\):\ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
            echo "Detected release version: $VERSION"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # For manual triggers, check package.json version and existing tag
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Manual trigger: found existing tag $TAG"
              echo "is_release=true" >> $GITHUB_OUTPUT
              echo "version=$VERSION" >> $GITHUB_OUTPUT
              echo "tag=$TAG" >> $GITHUB_OUTPUT
            else
              echo "Manual trigger: no tag found for v$VERSION"
              echo "is_release=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "Not a release commit, skipping"
          fi

      - name: Configure git
        if: steps.check.outputs.is_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check if tag exists
        if: steps.check.outputs.is_release == 'true'
        id: tag-check
        run: |
          if git rev-parse "${{ steps.check.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.check.outputs.tag }} already exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check.outputs.is_release == 'true' && steps.tag-check.outputs.exists != 'true'
        run: |
          git tag -a "${{ steps.check.outputs.tag }}" -m "Release ${{ steps.check.outputs.tag }}"
          git push origin "${{ steps.check.outputs.tag }}"
          echo "Created tag: ${{ steps.check.outputs.tag }}"

      - name: Security audit
        if: steps.check.outputs.is_release == 'true'
        run: npm audit --omit=dev --audit-level=high

      - name: Set build matrix
        id: matrix
        if: steps.check.outputs.is_release == 'true'
        run: |
          PLATFORMS="${{ inputs.platforms || 'all' }}"

          if [ "$PLATFORMS" == "all" ]; then
            echo 'matrix=[{"os":"ubuntu-latest","build_script":"build:linux","arch":"x64"},{"os":"ubuntu-24.04-arm","build_script":"build:linux","arch":"arm64"},{"os":"macos-15-intel","build_script":"build:mac","arch":"x64"},{"os":"macos-14","build_script":"build:mac","arch":"arm64"},{"os":"windows-latest","build_script":"build:win"}]' >> $GITHUB_OUTPUT
          elif [ "$PLATFORMS" == "linux" ]; then
            echo 'matrix=[{"os":"ubuntu-latest","build_script":"build:linux","arch":"x64"},{"os":"ubuntu-24.04-arm","build_script":"build:linux","arch":"arm64"}]' >> $GITHUB_OUTPUT
          elif [ "$PLATFORMS" == "macos" ]; then
            echo 'matrix=[{"os":"macos-15-intel","build_script":"build:mac","arch":"x64"},{"os":"macos-14","build_script":"build:mac","arch":"arm64"}]' >> $GITHUB_OUTPUT
          elif [ "$PLATFORMS" == "windows" ]; then
            echo 'matrix=[{"os":"windows-latest","build_script":"build:win"}]' >> $GITHUB_OUTPUT
          fi

  # Build and publish
  build:
    name: Build (${{ matrix.os }})
    needs: [check-release]
    if: needs.check-release.outputs.is_release == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check-release.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.check-release.outputs.tag }}

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          install-xvfb: 'true'

      - name: Install ARM64 build dependencies (Linux ARM64)
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libudev-dev \
            libusb-1.0-0-dev \
            ruby ruby-dev rubygems
          sudo gem install fpm --no-document

      - name: Cache electron-builder
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-${{ runner.arch }}-electron-builder-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-builder-

      - name: Import code signing certificate (macOS)
        if: runner.os == 'macOS' && env.CSC_LINK != ''
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Decode the certificate
          echo "$CSC_LINK" | base64 --decode > $RUNNER_TEMP/certificate.p12

          # Create and configure keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          security import $RUNNER_TEMP/certificate.p12 -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain-db

          # Verify the certificate was imported
          security find-identity -v -p codesigning $KEYCHAIN_PATH

          # Clean up the .p12 file
          rm -f $RUNNER_TEMP/certificate.p12

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -n "$CSC_LINK" ]; then
            npm run ${{ matrix.build_script }} -- --${{ matrix.arch }} --publish never
          else
            npm run ${{ matrix.build_script }} -- --${{ matrix.arch }} --config.mac.identity=null --publish never
          fi
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          npm run build:linux -- --${{ matrix.arch }} \
            --config.linux.target='[{"target":"AppImage","arch":["${{ matrix.arch }}"]},{"target":"deb","arch":["${{ matrix.arch }}"]},{"target":"tar.gz","arch":["${{ matrix.arch }}"]}]' \
            --publish never
        env:
          USE_SYSTEM_FPM: ${{ runner.arch == 'ARM64' && 'true' || '' }}
          npm_config_arch: ${{ matrix.arch }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npm run ${{ matrix.build_script }} -- --publish never

      - name: Install FUSE for AppImage (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Run smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:smoke
        timeout-minutes: 2

      - name: Run smoke test (macOS/Windows)
        if: runner.os != 'Linux'
        run: npm run test:smoke
        timeout-minutes: 2

      - name: Generate checksums (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd release
          shopt -s nullglob
          files=(*.AppImage *.deb *.tar.gz *.dmg *.zip)
          if [ ${#files[@]} -gt 0 ]; then
            for file in "${files[@]}"; do
              if command -v sha256sum &> /dev/null; then
                sha256sum "$file" >> SHA256SUMS.txt
              else
                shasum -a 256 "$file" >> SHA256SUMS.txt
              fi
            done
            cat SHA256SUMS.txt
          else
            echo "No artifacts found"
          fi
        shell: bash

      - name: Generate checksums (Windows)
        if: runner.os == 'Windows'
        run: |
          cd release
          Get-ChildItem -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -Append SHA256SUMS.txt -Encoding utf8
          }
          Get-Content SHA256SUMS.txt
        shell: pwsh

      - name: Verify auto-update YAML files
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          echo "=== Auto-update YAML files ==="
          ls -la release/latest*.yml 2>/dev/null || echo "Warning: No latest*.yml files found"
          for yml in release/latest*.yml; do
            if [ -f "$yml" ]; then
              echo ""
              echo "=== $(basename $yml) ==="
              cat "$yml"
            fi
          done
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*.dmg
            release/*.zip
            release/*.exe
            release/latest*.yml
            release/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14

  # Publish release only after ALL builds succeed
  publish:
    name: Publish Release
    needs: [check-release, build]
    runs-on: ubuntu-latest
    if: needs.check-release.outputs.is_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
          pattern: release-*

      - name: Prepare release files
        run: |
          mkdir -p release-files
          # Flatten all platform artifacts into one directory (excluding latest*.yml for now)
          find artifacts -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.tar.gz" \
            -o -name "*.dmg" -o -name "*.zip" -o -name "*.exe" \) \
            -exec cp {} release-files/ \;

          # Copy Linux YAML files directly (they have arch suffix for arm64)
          find artifacts -type f -name "latest-linux*.yml" -exec cp {} release-files/ \;

          # Copy Windows YAML file directly
          find artifacts -type f -name "latest.yml" -exec cp {} release-files/ \; 2>/dev/null || true

          ls -la release-files/

      - name: Merge macOS auto-update YAML files
        run: |
          # Find all macOS YAML files from different arch builds
          MAC_YAMLS=$(find artifacts -name "latest-mac.yml" -type f)
          MAC_YAML_COUNT=$(echo "$MAC_YAMLS" | grep -c "latest-mac.yml" || echo "0")

          echo "Found $MAC_YAML_COUNT macOS YAML files"

          if [ "$MAC_YAML_COUNT" -eq "0" ]; then
            echo "No macOS YAML files found, skipping merge"
          elif [ "$MAC_YAML_COUNT" -eq "1" ]; then
            echo "Single macOS YAML file, copying directly"
            cp $MAC_YAMLS release-files/latest-mac.yml
          else
            echo "Multiple macOS YAML files found, merging..."

            # Install yq for YAML manipulation
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq

            # Get the first YAML as base (for version, releaseDate, etc.)
            FIRST_YAML=$(echo "$MAC_YAMLS" | head -1)
            cp "$FIRST_YAML" release-files/latest-mac.yml

            # Extract and merge files arrays from all YAMLs
            echo "files:" > /tmp/merged-files.yml
            for yml in $MAC_YAMLS; do
              echo "Processing: $yml"
              yq '.files[]' "$yml" | while read -r line; do
                echo "  $line" >> /tmp/merged-files.yml
              done
            done

            # Merge the files array into the final YAML
            # First, get all files from all YAMLs
            ALL_FILES=""
            for yml in $MAC_YAMLS; do
              FILES=$(yq -o=json '.files' "$yml")
              if [ -z "$ALL_FILES" ]; then
                ALL_FILES="$FILES"
              else
                ALL_FILES=$(echo "$ALL_FILES $FILES" | jq -s 'add')
              fi
            done

            # Update the merged YAML with combined files array
            echo "$ALL_FILES" | yq -P '.' > /tmp/files-array.yml
            yq -i ".files = load(\"/tmp/files-array.yml\")" release-files/latest-mac.yml

            echo "=== Merged latest-mac.yml ==="
            cat release-files/latest-mac.yml
          fi

      - name: Generate combined checksums
        run: |
          cd release-files
          shopt -s nullglob
          files=(*.AppImage *.deb *.tar.gz *.dmg *.zip *.exe)
          if [ ${#files[@]} -gt 0 ]; then
            for file in "${files[@]}"; do
              sha256sum "$file" >> SHA256SUMS.txt
            done
            echo "=== SHA256SUMS.txt ==="
            cat SHA256SUMS.txt
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.2.1
        with:
          tag_name: ${{ needs.check-release.outputs.tag }}
          name: v${{ needs.check-release.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            release-files/*.AppImage
            release-files/*.deb
            release-files/*.tar.gz
            release-files/*.dmg
            release-files/*.zip
            release-files/*.exe
            release-files/latest*.yml
            release-files/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "## Release v${{ needs.check-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Published" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -la release-files/ >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Auto-Update YAML Files" >> $GITHUB_STEP_SUMMARY
          echo "| File | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          for yml in latest-linux.yml latest-linux-arm64.yml latest-mac.yml latest.yml; do
            if [ -f "release-files/$yml" ]; then
              echo "| $yml | ✅ Present |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $yml | ❌ Missing |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the [draft release](https://github.com/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY
          echo "2. Edit release notes if needed" >> $GITHUB_STEP_SUMMARY
          echo "3. Click **Publish release** to make it public" >> $GITHUB_STEP_SUMMARY
