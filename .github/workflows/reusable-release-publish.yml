name: Reusable Release Publish

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      version:
        description: Release version
        required: true
        type: string
      artifact_prefix:
        description: Artifact name prefix
        required: false
        default: release
        type: string

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
          pattern: ${{ inputs.artifact_prefix }}-*

      - name: Prepare release files
        run: |
          mkdir -p release-files
          # Flatten all platform artifacts into one directory (excluding latest*.yml for now)
          find artifacts -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.tar.gz" \
            -o -name "*.dmg" -o -name "*.zip" -o -name "*.exe" \) \
            -exec cp {} release-files/ \;

          # Copy Linux YAML files directly
          find artifacts -type f -name "latest-linux*.yml" -exec cp {} release-files/ \;

          # Copy Windows YAML file directly
          find artifacts -type f -name "latest.yml" -exec cp {} release-files/ \; 2>/dev/null || true

          ls -la release-files/

      - name: Merge macOS auto-update YAML files
        run: bash scripts/ci/merge-mac-yaml.sh artifacts release-files/latest-mac.yml

      - name: Validate macOS auto-update architectures
        run: |
          if [ ! -f "release-files/latest-mac.yml" ]; then
            echo "::error::latest-mac.yml is missing after merge"
            exit 1
          fi

          ARM64_COUNT=$(yq '.files[] | select(.arch == "arm64") | .url' release-files/latest-mac.yml | wc -l)
          X64_COUNT=$(yq '.files[] | select(.arch == "x64") | .url' release-files/latest-mac.yml | wc -l)

          echo "Found $ARM64_COUNT arm64 entries, $X64_COUNT x64 entries"

          if [ "$ARM64_COUNT" -lt 1 ]; then
            echo "::error::latest-mac.yml has no arm64 entries"
            exit 1
          fi
          if [ "$X64_COUNT" -lt 1 ]; then
            echo "::error::latest-mac.yml has no x64 entries"
            exit 1
          fi

          ABSOLUTE_URLS=$(yq '.files[].url | select(test("^https?://"))' release-files/latest-mac.yml || true)
          if [ -n "$ABSOLUTE_URLS" ]; then
            echo "::error::Detected absolute URLs in latest-mac.yml - potential redirect attack"
            echo "$ABSOLUTE_URLS"
            exit 1
          fi

          INVALID_HASHES=$(yq '.files[].sha512 | select(test("^[A-Za-z0-9+/]{86}==$") | not)' release-files/latest-mac.yml || true)
          if [ -n "$INVALID_HASHES" ]; then
            echo "::error::Invalid sha512 format detected"
            exit 1
          fi

          echo "Validation passed: $ARM64_COUNT arm64 + $X64_COUNT x64 entries, all URLs relative, all hashes valid"

      - name: Generate combined checksums
        run: |
          cd release-files
          shopt -s nullglob
          files=(*.AppImage *.deb *.tar.gz *.dmg *.zip *.exe)
          if [ ${#files[@]} -gt 0 ]; then
            for file in "${files[@]}"; do
              sha256sum "$file" >> SHA256SUMS.txt
            done
            echo "=== SHA256SUMS.txt ==="
            cat SHA256SUMS.txt
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.2.1
        with:
          tag_name: ${{ inputs.tag }}
          name: v${{ inputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            release-files/*.AppImage
            release-files/*.deb
            release-files/*.tar.gz
            release-files/*.dmg
            release-files/*.zip
            release-files/*.exe
            release-files/latest*.yml
            release-files/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "## Release v${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Published" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -la release-files/ >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Auto-Update YAML Files" >> $GITHUB_STEP_SUMMARY
          echo "| File | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          for yml in latest-linux.yml latest-mac.yml latest.yml; do
            if [ -f "release-files/$yml" ]; then
              echo "| $yml | Present |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $yml | Missing |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the [draft release](https://github.com/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY
          echo "2. Edit release notes if needed" >> $GITHUB_STEP_SUMMARY
          echo "3. Click **Publish release** to make it public" >> $GITHUB_STEP_SUMMARY
