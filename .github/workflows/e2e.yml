name: E2E Tests

on:
  pull_request:
    branches:
      - main
      - beta
    paths:
      - 'src/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
  workflow_dispatch:
    inputs:
      run_fullscreen_tests:
        description: Run fullscreen tests (may be flaky in CI)
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-linux:
    name: E2E Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app for E2E
        run: npm run build:vite

      - name: Run E2E tests
        run: xvfb-run --auto-servernum npm run test:e2e
        env:
          CI: true
          RUN_FULLSCREEN_TESTS: ${{ inputs.run_fullscreen_tests || 'false' }}

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report-linux
          path: |
            playwright-report/
            tests/e2e/test-results/
          retention-days: 7

  e2e-macos:
    name: E2E Tests (macOS)
    runs-on: macos-latest
    if: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app for E2E
        run: npm run build:vite

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          RUN_FULLSCREEN_TESTS: ${{ inputs.run_fullscreen_tests || 'false' }}

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report-macos
          path: |
            playwright-report/
            tests/e2e/test-results/
          retention-days: 7

  e2e-windows:
    name: E2E Tests (Windows)
    runs-on: windows-latest
    if: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    steps:
      - name: Configure git line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app for E2E
        run: npm run build:vite

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          RUN_FULLSCREEN_TESTS: ${{ inputs.run_fullscreen_tests || 'false' }}

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report-windows
          path: |
            playwright-report/
            tests/e2e/test-results/
          retention-days: 7
