version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

    # Ignore major updates for build-critical packages
    # These require manual review due to potential breaking changes
    ignore:
      - dependency-name: "electron-builder"
        update-types: ["version-update:semver-major"]
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # TypeScript major bumps require coordinated upgrade of @typescript-eslint/*
      # and vitest. See CONTRIBUTING.md → "Upgrading TypeScript (major)".
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/eslint-plugin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/parser"
        update-types: ["version-update:semver-major"]

    # A dependency joins the first group it matches, so group order is load-bearing:
    # lockstep groups come first, catch-all groups by dependency type come last.
    groups:
      # @trpc/client and @trpc/server require each other at the exact same version, so an
      # update to either alone cannot install. Majors included: they must still travel together.
      trpc:
        patterns:
          - "@trpc/*"
        update-types:
          - "major"
          - "minor"
          - "patch"

      # The test DI harness reads inversify's constructor metadata through @inversifyjs/core,
      # which must resolve to the same single copy inversify depends on
      # (enforced by tests/unit/scripts/dependency-singletons.test.ts).
      inversify:
        patterns:
          - "inversify"
          - "@inversifyjs/*"
        update-types:
          - "major"
          - "minor"
          - "patch"

      # TypeScript ecosystem - keep TS, its lint tooling, and @types/* in sync
      typescript-ecosystem:
        patterns:
          - "typescript"
          - "@typescript-eslint/*"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"

      # Electron ecosystem - keep together for coordinated updates
      electron-ecosystem:
        patterns:
          - "electron*"
          - "vite-plugin-electron*"
        update-types:
          - "minor"
          - "patch"

      # Remaining dev dependencies
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

      # Remaining production dependencies
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows only; composite actions each live in their own directory.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
