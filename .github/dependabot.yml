version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

    # Majors of these packages are coordinated manual upgrades (CONTRIBUTING.md →
    # "Packages excluded from automatic major bumps"). Ignoring the major also keeps their
    # minor and patch updates flowing: Dependabot only proposes a dependency's latest
    # non-ignored version, and skips it when that version is outside the group's update-types.
    ignore:
      - dependency-name: "electron-builder"
        update-types: ["version-update:semver-major"]
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # TypeScript major bumps require coordinated upgrade of @typescript-eslint/*
      # and vitest. See CONTRIBUTING.md → "Upgrading TypeScript (major)".
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/eslint-plugin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/parser"
        update-types: ["version-update:semver-major"]
      # @trpc/client and @trpc/server require each other at the exact same version, and a
      # tRPC major also changes the contract of the Electron IPC transport.
      - dependency-name: "@trpc/*"
        update-types: ["version-update:semver-major"]
      # @vitest/coverage-v8 and @vitest/ui require vitest at the exact same version.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      # @inversifyjs/core must be the exact core inversify depends on, which Dependabot cannot
      # derive. tests/unit/scripts/dependency-singletons.test.ts fails when the two diverge.
      - dependency-name: "@inversifyjs/core"

    # A dependency matching several groups joins the most specific one: an exact name outranks
    # a dependency-type group, which outranks a wildcard pattern. The dependency-type groups
    # therefore exclude the patterns of every group above them.
    groups:
      # @trpc/client and @trpc/server require each other at the exact same version.
      trpc:
        patterns:
          - "@trpc/*"
        update-types:
          - "minor"
          - "patch"

      # @vitest/coverage-v8 and @vitest/ui require vitest at the exact same version.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"

      # TypeScript ecosystem - keep TS, its lint tooling, and @types/* in sync
      typescript-ecosystem:
        patterns:
          - "typescript"
          - "@typescript-eslint/*"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"

      # Electron ecosystem - keep together for coordinated updates
      electron-ecosystem:
        patterns:
          - "electron*"
          - "vite-plugin-electron*"
        update-types:
          - "minor"
          - "patch"

      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@trpc/*"
          - "vitest"
          - "@vitest/*"
          - "typescript"
          - "@typescript-eslint/*"
          - "@types/*"
          - "electron*"
          - "vite-plugin-electron*"

      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@trpc/*"
          - "vitest"
          - "@vitest/*"
          - "typescript"
          - "@typescript-eslint/*"
          - "@types/*"
          - "electron*"
          - "vite-plugin-electron*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows only; composite actions each live in their own directory.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
